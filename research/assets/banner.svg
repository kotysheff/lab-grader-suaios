<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Очередь на защиту — исследование стратегий</title>
  <desc id="desc">Три авторские модели, шесть стратегий и десять тысяч общих сценариев</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b3a"/><stop offset="1" stop-color="#195348"/></linearGradient></defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <g fill="none" stroke="#8ed2b8" opacity=".16"><circle cx="1100" cy="0" r="240"/><circle cx="1100" cy="0" r="185"/><circle cx="1100" cy="0" r="130"/></g>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="55" y="55" fill="#99d5bd" font-size="16" letter-spacing="3">QUEUE RESEARCH / 2026</text>
    <text x="55" y="116" fill="#fff" font-size="43" font-weight="700">Очередь на защиту</text>
    <text x="55" y="155" fill="#c3dcd7" font-size="20">Как порядок вызова влияет на итоговые оценки</text>
    <g fill="#fff" font-size="33" font-weight="700"><text x="55" y="236">3</text><text x="300" y="236">6</text><text x="545" y="236">10 000</text><text x="865" y="236">4–5</text></g>
    <g fill="#b7d3cd" font-size="16"><text x="55" y="267">авторские модели</text><text x="300" y="267">стратегий</text><text x="545" y="267">общих сценариев</text><text x="865" y="267">целевые оценки</text></g>
  </g>
</svg>
